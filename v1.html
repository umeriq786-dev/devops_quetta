<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07150d">
  <title>DevOps App — Version 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      overflow: hidden;
      color: #f5f7fa;
      background: radial-gradient(ellipse at 50% 115%, #173d27 0%, transparent 52%),
                  linear-gradient(135deg, #07150d 0%, #102c1b 52%, #08180f 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; width: 22rem; height: 22rem; border-radius: 50%;
      filter: blur(90px); opacity: .16; animation: drift 12s ease-in-out infinite alternate; }
    .orb-one { background: #22c55e; top: -13rem; left: 8%; }
    .orb-two { background: #84cc16; right: -13rem; bottom: -12rem; animation-delay: -5s; }
    .hero { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
    .hero-card { max-width: 760px; animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: .6rem; padding: .5rem .85rem;
      color: #c6d4e8; border: 1px solid #ffffff20; border-radius: 999px; background: #ffffff08;
      font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; }
    .status-dot { width: .45rem; height: .45rem; border-radius: 50%; background: #60e6a8; box-shadow: 0 0 12px #60e6a8; }
    h1 { font-size: clamp(2.8rem, 8vw, 5.6rem); font-weight: 750; letter-spacing: -.065em; line-height: 1.02; }
    .version { color: #9ebcff; background: linear-gradient(90deg, #9ebcff, #c5a8ff);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .lead { max-width: 540px; color: #9ba6b7; font-size: clamp(1rem, 2vw, 1.18rem); line-height: 1.8; }
    .rule { width: 54px; height: 3px; border-radius: 3px; margin: 1.7rem auto; background: linear-gradient(90deg, #6ea2ff, #ae8aff); }
    .btn-launch { color: #0a0d13; background: #eef3ff; border: 0; font-weight: 650; transition: transform .2s, box-shadow .2s; }
    .btn-launch:hover { color: #0a0d13; background: #fff; transform: translateY(-2px); box-shadow: 0 10px 35px #8baeff35; }
    .footer-note { color: #626d7d; font-size: .8rem; letter-spacing: .04em; }
    @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { to { transform: translate(55px, 35px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div></div>
  <main class="hero text-center">
    <section class="hero-card container">
      <div class="eyebrow mb-4"><span class="status-dot"></span> DevOps app by Umer</div>
      <h1 class="mb-3">Built to ship.<br><span class="version">Version 333333333.</span></h1>
      <div class="rule"></div>
      <p class="lead mx-auto mb-4">This is version 3333333 of the DevOps app. A fresh start for building, automating, and delivering better.</p>
      <a class="btn btn-launch rounded-pill px-4 py-3" href="#welcome">Explore the beginning <span aria-hidden="true">&nbsp;→</span></a>
      <p class="footer-note mt-5 mb-0" id="welcome">Simple beginnings. Continuous progress.</p>
    </section>
  </main>
</body>
</html>
